<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metaCatBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="metaCatEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="metaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#metaGlow)">
    <!-- Cat Head Base Polygon (Crisp Cyber Silhouette) -->
    <path d="M5,6 L10,13 L16,10 L22,13 L27,6 L28,17 C28,24 22,28.5 16,28.5 C10,28.5 4,24 4,17 Z" 
      fill="url(#metaCatBody)" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Inner Ear Neon Highlights -->
    <polygon points="7,8 11.5,13.5 6.5,14" fill="url(#metaCatEar)"/>
    <polygon points="25,8 20.5,13.5 25.5,14" fill="url(#metaCatEar)"/>

    <!-- Cyber Visor Eyes (High-Voltage Blazing Glow) -->
    <!-- Left Eye -->
    <ellipse cx="11.5" cy="18" rx="2.6" ry="3.8" fill="#FFFFFF" transform="rotate(-5 11.5 18)"/>
    <ellipse cx="11.5" cy="18" rx="1.3" ry="2.2" fill="#00F5FF" transform="rotate(-5 11.5 18)"/>
    <!-- Eye Sparkle -->
    <circle cx="10.8" cy="16.5" r="0.8" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="20.5" cy="18" rx="2.6" ry="3.8" fill="#FFFFFF" transform="rotate(5 20.5 18)"/>
    <ellipse cx="20.5" cy="18" rx="1.3" ry="2.2" fill="#00F5FF" transform="rotate(5 20.5 18)"/>
    <!-- Eye Sparkle -->
    <circle cx="21.2" cy="16.5" r="0.8" fill="#FFFFFF"/>

    <!-- Cute Cyber Nose -->
    <polygon points="16,21.5 15,22.8 17,22.8" fill="#FFFFFF"/>

    <!-- Iconic Cute W Mouth -->
    <path d="M13.2,23.8 Q14.6,25.4 16,23.8 Q17.4,25.4 18.8,23.8" 
      stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Cyber Whisker Neon Lines -->
    <path d="M2.5,18.5 L6.5,19 M2,21.5 L6.5,21" stroke="#00F5FF" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M29.5,18.5 L25.5,19 M30,21.5 L25.5,21" stroke="#00F5FF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
