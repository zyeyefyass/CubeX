<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Depth Glow -->
    <radialGradient id="space-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#002d50" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#001428" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000b16" stop-opacity="0"/>
    </radialGradient>

    <!-- Star A: sing-box (Deep Violet Quantum Pulsar) -->
    <radialGradient id="star-singbox" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>

    <!-- Star B: mihomo (Electric Cyan Kinetic Pulsar) -->
    <radialGradient id="star-mihomo" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="65%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Orbit Ribbon Gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cube Facet Gradients (MikroTik Tech Deep Blue + Glass) -->
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004e82" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#002440" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00355c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00172e" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004675" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#001c36" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyper-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Space Core -->
  <rect x="0" y="0" width="200" height="200" rx="36" fill="url(#space-glow)"/>

  <!-- Back Orbit Ellipse (Behind Cube) -->
  <path d="M 40 120 C 30 70, 110 40, 160 70" 
        stroke="url(#orbit-grad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.45" stroke-dasharray="4 3"/>

  <!-- Outer Isometric Hypercube (Wireframe + Translucent Glass) -->
  <!-- Top Face: (100,28) -> (156,60) -> (100,92) -> (44,60) -->
  <polygon points="100,28 156,60 100,92 44,60" fill="url(#cube-top)" stroke="#00d2ff" stroke-width="1.8" stroke-linejoin="round" opacity="0.85"/>
  <!-- Left Face: (44,60) -> (100,92) -> (100,156) -> (44,124) -->
  <polygon points="44,60 100,92 100,156 44,124" fill="url(#cube-left)" stroke="#004e82" stroke-width="1.8" stroke-linejoin="round" opacity="0.85"/>
  <!-- Right Face: (100,92) -> (156,60) -> (156,124) -> (100,156) -->
  <polygon points="100,92 156,60 156,124 100,156" fill="url(#cube-right)" stroke="#00d2ff" stroke-width="1.8" stroke-linejoin="round" opacity="0.75"/>

  <!-- Inner Tesseract Perspective Struts (Hypercube Dimension Links) -->
  <line x1="100" y1="28" x2="100" y2="60" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
  <line x1="156" y1="60" x2="128" y2="76" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
  <line x1="156" y1="124" x2="128" y2="108" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
  <line x1="100" y1="156" x2="100" y2="124" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
  <line x1="44" y1="124" x2="72" y2="108" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
  <line x1="44" y1="60" x2="72" y2="76" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>

  <!-- Foreground Dynamic Orbit Ring (Weaving Through Center) -->
  <path d="M 160 70 C 180 100, 140 145, 90 140 C 55 136, 35 110, 50 85" 
        stroke="url(#orbit-grad)" stroke-width="3.2" stroke-linecap="round" fill="none" filter="url(#hyper-glow)"/>

  <!-- BINARY STAR 1: sing-box Pulsar (Deep Quantum Violet - Upper Left Focal) -->
  <g filter="url(#star-glow)">
    <!-- Halo ring -->
    <circle cx="78" cy="82" r="15" fill="#9333ea" opacity="0.35"/>
    <circle cx="78" cy="82" r="10" fill="#a855f7" opacity="0.6"/>
    <!-- Core Star Sphere -->
    <circle cx="78" cy="82" r="7.5" fill="url(#star-singbox)"/>
    <!-- Quantum Sparkle Flares -->
    <line x1="68" y1="82" x2="88" y2="82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="78" y1="72" x2="78" y2="92" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Gravitational Bridge / Bridge Stream between Stars -->
  <path d="M 84 86 Q 102 96 122 104" stroke="#e0e7ff" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.8"/>

  <!-- BINARY STAR 2: mihomo Pulsar (Electric Cyan Laser - Lower Right Focal) -->
  <g filter="url(#star-glow)">
    <!-- Halo ring -->
    <circle cx="124" cy="106" r="16" fill="#00d2ff" opacity="0.35"/>
    <circle cx="124" cy="106" r="11" fill="#38bdf8" opacity="0.6"/>
    <!-- Core Star Sphere -->
    <circle cx="124" cy="106" r="8" fill="url(#star-mihomo)"/>
    <!-- Kinetic Sparkle Flares -->
    <line x1="113" y1="106" x2="135" y2="106" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="124" y1="95" x2="124" y2="117" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Outer Orbit Satellite Particles -->
  <circle cx="154" cy="116" r="2.2" fill="#00d2ff" opacity="0.8"/>
  <circle cx="58" cy="112" r="1.8" fill="#c084fc" opacity="0.8"/>
  <circle cx="140" cy="50" r="1.5" fill="#38bdf8" opacity="0.7"/>
</svg>
