<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 方案 2: 时空流光棱镜动力体 (Prismatic Chrono-Cube) -->
  <defs>
    <!-- 全息分光棱镜多层渐变 -->
    <linearGradient id="prismTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#002D50" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#004E82" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#001529" stop-opacity="0.98"/>
    </linearGradient>
    <!-- 4色折射光谱光束 -->
    <linearGradient id="beamHK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamJPKR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamSG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamUS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <filter id="prismGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes prismFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3.5px) rotate(-1.5deg); }
    }
    @keyframes spectralCycle {
      0% { opacity: 0.55; stroke-dashoffset: 100; filter: drop-shadow(0 0 4px #00d2ff); }
      50% { opacity: 1; stroke-dashoffset: 0; filter: drop-shadow(0 0 10px #c084fc); }
      100% { opacity: 0.55; stroke-dashoffset: -100; filter: drop-shadow(0 0 4px #00d2ff); }
    }
    @keyframes crystalRefract {
      0%, 100% { transform: scale(0.96) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.06) rotate(180deg); opacity: 1; }
    }
    .mc-prism-body { animation: prismFloat 5.5s ease-in-out infinite; transform-origin: 50px 50px; }
    .mc-spectral-edge { stroke-dasharray: 20 40; animation: spectralCycle 3s linear infinite; }
    .mc-refract-core { animation: crystalRefract 8s ease-in-out infinite; transform-origin: 50px 50px; }
  </style>

  <!-- 外围全息分光光环 -->
  <circle cx="50" cy="50" r="41" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="6 8" fill="none"/>
  <circle cx="50" cy="50" r="43.5" stroke="#C084FC" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="2 6" fill="none"/>

  <g class="mc-prism-body">
    <!-- 折射出射的4色激光束 (象征全网智能分流透传) -->
    <path d="M50,50 L86,18" stroke="url(#beamHK)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M50,50 L92,54" stroke="url(#beamJPKR)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M50,50 L78,88" stroke="url(#beamSG)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M50,50 L14,76" stroke="url(#beamUS)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

    <!-- 水晶透视底背影 (展现3D空间深度) -->
    <polygon points="50,22 76,37 50,52 24,37" fill="#001529" fill-opacity="0.6"/>

    <!-- 棱镜主立方体三大面 (全息水晶质感) -->
    <polygon points="50,16 80,33 50,50 20,33" fill="url(#prismTop)" stroke="#BAE6FD" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="20,33 50,50 50,84 20,67" fill="url(#prismLeft)" stroke="#38BDF8" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="50,50 80,33 80,67 50,84" fill="url(#prismRight)" stroke="#C084FC" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- 内部光子晶格透视线 -->
    <line x1="50" y1="50" x2="50" y2="16" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="50" y1="50" x2="20" y2="67" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="50" y1="50" x2="80" y2="67" stroke="#E879F9" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- 流光棱线激光轮廓 -->
    <path class="mc-spectral-edge" d="M50,16 L80,33 L80,67 L50,84 L20,67 L20,33 Z" stroke="#FFFFFF" stroke-width="1.8" fill="none" filter="url(#prismGlow)"/>

    <!-- 核心折射八面体晶核 -->
    <g class="mc-refract-core">
      <polygon points="50,40 58,50 50,60 42,50" fill="url(#prismTop)" opacity="0.95"/>
      <polygon points="50,40 58,50 50,50" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="50" cy="50" r="3.2" fill="#FFFFFF" filter="url(#prismGlow)"/>
    </g>

    <!-- 棱镜关键晶体顶点光斑 -->
    <circle cx="50" cy="16" r="2.2" fill="#FFFFFF"/>
    <circle cx="80" cy="33" r="1.8" fill="#F43F5E"/>
    <circle cx="80" cy="67" r="1.8" fill="#10B981"/>
    <circle cx="50" cy="84" r="2" fill="#38BDF8"/>
    <circle cx="20" cy="67" r="1.8" fill="#818CF8"/>
    <circle cx="20" cy="33" r="1.8" fill="#00D2FF"/>
    <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
