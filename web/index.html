<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-cubex.svg" />
    <link rel="apple-touch-icon" href="/logo-cubex.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CubeX" />
    <meta name="application-name" content="CubeX" />
    <meta name="color-scheme" content="light dark" />
    <meta name="msapplication-TileColor" content="#0D0D11" />
    <meta name="theme-color" content="#0D0D11" />
    <title>CubeX · 宿主共生零感网络系统</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cubex_color_mode');
          var mode = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var bg = mode === 'light' ? '#F4F4F9' : '#0D0D11';
          var root = document.documentElement;
          root.setAttribute('data-theme', mode);
          root.style.colorScheme = mode;
          root.style.backgroundColor = bg;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', bg);
          var ms = document.querySelector('meta[name="msapplication-TileColor"]');
          if (ms) ms.setAttribute('content', bg);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#0D0D11';
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500/30">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
