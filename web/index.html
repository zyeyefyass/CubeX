<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-cubex.svg" />
    <link rel="apple-touch-icon" href="/logo-cubex.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CubeX" />
    <meta name="application-name" content="CubeX" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-TileColor" content="#090f1d" />
    <meta name="theme-color" content="#090f1d" />
    <title>CubeX · 宿主共生零感网络系统</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cubex_color_mode');
          var mode = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500/30">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
