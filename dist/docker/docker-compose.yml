version: '3.8'

services:
  cubex:
    image: zyeyefyass/cubex:latest
    container_name: cubex
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/opt/CubeX/data
      - ./etc:/opt/CubeX/etc
    environment:
      - TZ=Asia/Shanghai
      - CUBEX_LISTEN=:2026
      - GOMEMLIMIT=60MiB
      - GOGC=30
