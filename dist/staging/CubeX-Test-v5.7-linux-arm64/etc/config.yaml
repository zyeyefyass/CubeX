secret: ""
sniffer:
    enable: true
    force-dns-mapping: true
    override-destination: true
    parse-pure-ip: true
    skip-domain:
        - dlg.io.mi.com
        - +.mijia.tech
        - +.io.mi.com
        - +.apple.com
        - +.push.apple.com
    sniff:
        HTTP:
            ports:
                - 80
                - 8080-8880
        QUIC:
            ports:
                - 443
                - 8443
        TLS:
            ports:
                - 443
                - 8443
tcp-concurrent: true
tproxy-port: 7893
tun:
    auto-detect-interface: true
    auto-redirect: false
    auto-route: true
    device: cubex-tun
    dns-hijack:
        - tcp://any:53
        - udp://any:53
    dns-mode: hijack
    enable: true
    endpoint-independent-nat: true
    gso: true
    gso-max-size: 65536
    mtu: 1400
    route-exclude-address:
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
