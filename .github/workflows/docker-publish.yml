name: Build and Publish Multi-Arch Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'Test-v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker-build:
    name: Build & Push Multi-Arch Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME && format('docker.io/{0}/cubex', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=CubeX
            org.opencontainers.image.description=CubeX ${{ github.ref_name }} · 双引擎宿主共生零感网关 · 多架构通用兼容
            org.opencontainers.image.vendor=CubeX Lab
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.url=https://hub.docker.com/r/fyasshole/cubex
            org.opencontainers.image.source=https://github.com/zyeyefyass/CubeX
            org.opencontainers.image.icon=https://raw.githubusercontent.com/zyeyefyass/CubeX/main/assets/logo.png

      - name: Prepare Multi-Arch Embedded Cores & Rulesets
        run: |
          mkdir -p bin/amd64 bin/arm64 etc/rules data

          MH_VER=$(python3 -c 'import json; d=json.load(open("meta.json")); print(d.get("core_versions", {}).get("mihomo", "v1.19.34"))')
          SB_TAG=$(python3 -c 'import json; d=json.load(open("meta.json")); print(d.get("core_versions", {}).get("sing_box", "v1.14.5"))')
          SB_VER="${SB_TAG#v}"

          echo "Downloading official Mihomo ${MH_VER} binaries (-compatible- amd64 + arm64)..."
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/${MH_VER}/mihomo-linux-amd64-compatible-${MH_VER}.gz" | gzip -d > bin/amd64/mihomo
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/${MH_VER}/mihomo-linux-arm64-${MH_VER}.gz" | gzip -d > bin/arm64/mihomo
          chmod +x bin/amd64/mihomo bin/arm64/mihomo

          echo "Downloading official static musl sing-box ${SB_TAG} binaries..."
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_VER}-linux-amd64-musl.tar.gz" | tar -xz -C /tmp
          mv /tmp/sing-box-*/sing-box bin/amd64/sing-box
          rm -rf /tmp/sing-box-*
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_VER}-linux-arm64-musl.tar.gz" | tar -xz -C /tmp
          mv /tmp/sing-box-*/sing-box bin/arm64/sing-box
          rm -rf /tmp/sing-box-*
          chmod +x bin/amd64/sing-box bin/arm64/sing-box

          echo "Downloading GeoIP and GeoSite rulesets..."
          curl -sLo etc/geosite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          curl -sLo etc/GeoIP.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUBEX_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub Repository Overview
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 scripts/publish_release.py --sync-dockerhub-only --tag "${GITHUB_REF#refs/tags/}"

      - name: Build & Save Offline Docker Image (for fnOS / Offline Users)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist/docker
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          
          # Build single-arch amd64 image for local export
          docker buildx build --platform linux/amd64 -t cubex:${TAG_NAME} -t cubex:latest -f ./Dockerfile --output type=docker,dest=dist/docker/CubeX-${TAG_NAME}-docker-amd64.tar .
          
          echo "Compressing Docker offline image for fnOS..."
          gzip -9 dist/docker/CubeX-${TAG_NAME}-docker-amd64.tar

      - name: Upload Docker Image to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docker/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
